[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mega-16s-similarity-visualisation"
version = "0.1.0"
description = "Convert MEGA p-distances to 16S similarity tables and heatmaps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.scripts]
mega-16s-similarity = "make_16s_similarity_heatmap:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["make_16s_similarity_heatmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
