[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "af3-input-prep"
version = "0.1.0"
description = "Prepare AlphaFold 3 input JSON files from small TSV specifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.85",
]

[project.scripts]
af3_input_prep = "af3_input_prep:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["af3_input_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
